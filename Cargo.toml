[workspace]
members = ["crates/arcnix-core", "crates/arcnix"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/taidge/arcnix"
homepage = "https://github.com/taidge/arcnix"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arcnix-core = { version = "0.1.1", path = "crates/arcnix-core" }
