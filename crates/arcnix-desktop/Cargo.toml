[package]
name = "arcnix-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A friendly desktop workspace for managing servers over SSH"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ssh", "sftp", "desktop", "server", "terminal"]
categories = ["gui", "network-programming"]

[[bin]]
name = "arcnix"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
zeroize = "1"
time = { version = "0.3", features = ["formatting", "local-offset"] }
arcnix-core.workspace = true
glory = { version = "=0.7.0", features = ["wry"] }
sapid = "=0.7.1"
async-channel = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }
