name: Publish crates

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 tools/check_release.py

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to crates.io
    needs: [validate, checks]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.0
      - uses: ./.github/actions/cargo-cache
      - uses: ./.github/actions/windows-build-tools
      - name: Publish dependency and desktop crates
        shell: pwsh
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          if (-not $env:CARGO_REGISTRY_TOKEN) {
            throw 'Make the CRATES_TOKEN Actions secret available to this repository before pushing a release tag.'
          }
          cargo publish --workspace --locked
